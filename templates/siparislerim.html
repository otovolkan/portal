<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><title>Siparişlerim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded shadow border-0">
    <div class="d-flex justify-content-between mb-4 border-bottom pb-2 align-items-center">
        <div>
            <h2 class="fw-bold text-primary mb-0">📋 SİPARİŞLERİM</h2>
            <small class="text-muted">Bayi: <b>{{ bayi_adi }}</b></small>
        </div>
        <a href="/" class="btn btn-outline-primary fw-bold">⬅ Kataloğa Dön</a>
    </div>
    <table class="table table-hover align-middle">
        <thead class="table-dark">
            <tr><th>No</th><th>Tarih</th><th>Saat</th><th>Toplam</th><th>İşlem</th></tr>
        </thead>
        <tbody>
            {% for s in siparisler %}
            <tr>
                <td><b>#{{ s.siparis_no }}</b></td>
                <td>{{ s.tarih }}</td>
                <td>{{ s.saat }}</td>
                <td class="fw-bold text-success">{{ s.toplam }}</td>
                <td><button class="btn btn-sm btn-primary fw-bold" onclick="detay('{{ loop.index }}')">DETAY</button></td>
            </tr>
            <tr id="d-{{ loop.index }}" style="display:none;" class="bg-light">
                <td colspan="5" class="p-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header py-1 small fw-bold bg-secondary text-white">Sipariş İçeriği (#{{ s.siparis_no }})</div>
                        <ul class="list-group list-group-flush">
                            {% for u in s.urunler %}
                            <li class="list-group-item d-flex justify-content-between p-2 small">
                                <span>{{ u.ad }}</span><b>{{ u.adet }} Adet</b>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>
function detay(id) {
    let p = document.getElementById('d-' + id);
    p.style.display = (p.style.display === 'none') ? 'table-row' : 'none';
}
</script>
</body>
</html>
