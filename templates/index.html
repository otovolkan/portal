<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>OTO VOLKAN B2B PORTAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-blue { background-color: #0066ff; color: white; padding: 20px 40px; }
        .search-box { background: white; border: 1px solid #0066ff; border-radius: 10px; padding: 25px; margin-top: -30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product-card { border: 1px solid #eee; padding: 15px; text-align: center; height: 100%; border-radius: 12px; transition: 0.3s; }
        .product-card:hover { border-color: #0066ff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-img { height: 160px; object-fit: contain; width: 100%; margin-bottom: 10px; }
        .btn-sorgula { background-color: #0066ff; color: white; font-weight: bold; padding: 10px 40px; }
    </style>
</head>
<body class="bg-light">

<div class="header-blue">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="mb-0 fw-bold">OTO VOLKAN</h1>
            <p class="mb-0">B2B PORTAL</p>
            <small>Hoş Geldiniz: <strong>{{ bayi }}</strong></small>
        </div>
        <div>
            <button class="btn btn-warning fw-bold px-4">SEPET (<span id="s-adet">0</span>)</button>
            <a href="/cikis" class="btn btn-danger ms-2">Çıkış</a>
        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="search-box">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" id="aramaInput" class="form-control form-control-lg" placeholder="Parça No veya Ürün Adı...">
            </div>
            <div class="col-md-4">
                <select id="markaSec" class="form-select form-select-lg">
                    <option value="">Tüm Markalar</option>
                    {% for m in markalar %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-sorgula btn-lg w-100" onclick="filtrele()">SORGULA</button>
            </div>
        </div>
    </div>

    <div class="row mt-5" id="urun-grid">
        {% for u in urunler %}
        <div class="col-md-3 mb-4 urun-item" data-marka="{{ u.marka }}" data-ad="{{ u.urun_adi }}">
            <div class="product-card bg-white shadow-sm">
                <img src="{{ url_for('static', filename='images/' + u.resim) }}" class="product-img" onerror="this.src='https://via.placeholder.com/150?text=Resim+Yok'">
                <h6 class="fw-bold">{{ u.urun_adi }}</h6>
                <p class="text-muted small mb-1">{{ u.marka }}</p>
                <h5 class="text-success fw-bold">{{ u.fiyat }}</h5>
                <button class="btn btn-primary w-100 mt-2" onclick="sepeteAt('{{ u.urun_adi }}', '{{ u.fiyat }}')">Sepete Ekle</button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    let sepet = [];
    function sepeteAt(ad, fiyat) {
        sepet.push({ad, fiyat});
        document.getElementById('s-adet').innerText = sepet.length;
    }
    function filtrele() {
        let arama = document.getElementById('aramaInput').value.toLowerCase();
        let marka = document.getElementById('markaSec').value;
        document.querySelectorAll('.urun-item').forEach(el => {
            let ad = el.getAttribute('data-ad').toLowerCase();
            let m = el.getAttribute('data-marka');
            let durum = ad.includes(arama) && (marka === "" || m === marka);
            el.style.display = durum ? "block" : "none";
        });
    }
</script>
</body>
</html>
