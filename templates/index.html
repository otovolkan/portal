<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Özeti - Oto Volkan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table thead th { background-color: #f8f9fa; color: #333; font-weight: bold; border-bottom: 2px solid #dee2e6; }
        .genel-toplam-text { color: #666; font-size: 1.2rem; }
        .genel-toplam-fiyat { color: #157347; font-size: 2.2rem; font-weight: bold; }
        .btn-whatsapp { background-color: #198754; color: white; font-weight: bold; padding: 12px 30px; border-radius: 8px; font-size: 1.1rem; }
        .btn-kaldir { background-color: #dc3545; color: white; border-radius: 5px; font-weight: bold; padding: 5px 15px; border: none; text-decoration: none; }
    </style>
</head>
<body class="bg-white">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><span class="me-2">🛒</span> Sipariş Özeti</h2>
        <a href="/" class="btn btn-outline-primary btn-sm fw-bold">⬅ Kataloğa Dön</a>
    </div>

    <div class="table-responsive">
        <table class="table align-middle text-center">
            <thead>
                <tr>
                    <th class="text-start">Ürün</th>
                    <th>Miktar</th>
                    <th>Birim (KDVli)</th>
                    <th>Ara Toplam</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody>
                {% for p in sepet %}
                <tr>
                    <td class="text-start fw-bold text-uppercase">{{ p.urun_adi }} ({{ p.urun_no }})</td>
                    <td>{{ p.miktar }} adet</td>
                    <td>{{ p.fiyat }}</td>
                    <td class="fw-bold text-dark">{{ p.ara_toplam }}</td>
                    <td>
                        <a href="{{ url_for('sepet_sil', urun_no=p.urun_no) }}" class="btn-kaldir">Kaldır</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="text-end mt-4">
        <div class="genel-toplam-text">Genel Toplam</div>
        <div class="genel-toplam-fiyat">{{ genel_toplam }}</div>
        <div class="text-muted small mb-4">(Fiyatlara %20 KDV dahildir)</div>
        
        <button onclick="whatsappGonder()" class="btn btn-whatsapp shadow">SİPARİŞİ WHATSAPP İLE GÖNDER</button>
    </div>
</div>

<script>
function whatsappGonder() {
    let mesaj = "*Yeni Sipariş - OTO VOLKAN B2B*\n";
    mesaj += "Bayi: {{ bayi_adi }}\n--------------------------\n";
    
    {% for p in sepet %}
    mesaj += "• {{ p.urun_adi }} ({{ p.miktar }} Adet)\n";
    {% endfor %}
    
    mesaj += "--------------------------\n*Toplam: {{ genel_toplam }}*";
    
    let url = "https://wa.me/905321234567?text=" + encodeURIComponent(mesaj); // Buraya kendi numaranı yaz ustam
    window.open(url, '_blank');
}
</script>

</body>
</html>
