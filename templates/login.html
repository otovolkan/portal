<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><title>Oto Volkan B2B Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 400px; padding: 40px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .brand-name { font-size: 2.2rem; font-weight: 800; color: #0d6efd; margin-bottom: 0; line-height: 1; }
        .b2b-label { font-size: 1.2rem; font-weight: 600; color: #6c757d; margin-bottom: 30px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="login-card border">
        <div class="brand-name text-uppercase">Oto Volkan</div>
        <div class="b2b-label text-uppercase">B2B PORTAL</div>
        <form method="POST">
            <div class="mb-4">
                <input type="text" name="bayi_kodu" class="form-control form-control-lg text-center" placeholder="Bayi Kodunuzu Giriniz" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">GİRİŞ YAP</button>
        </form>
        <p class="text-muted mt-4 small">© 2026 Oto Volkan - Tüm Hakları Saklıdır.</p>
    </div>
</body>
</html>
