<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><title>Sepetim - Oto Volkan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm py-3"><div class="container"><a class="navbar-brand fw-bold fs-3" href="/">OTO VOLKAN</a></div></nav>
<div class="container mt-5">
    <div class="bg-white p-5 rounded-4 shadow border border-primary border-opacity-25">
        <h2 class="fw-bold text-primary mb-4 text-uppercase">🛒 Sipariş Listeniz</h2>
        <hr>
        {% if sepet %}
        <div class="table-responsive">
            <table class="table align-middle text-center table-hover">
                <thead class="table-dark">
                    <tr><th>GÖRSEL</th><th>ÜRÜN NO</th><th>ÜRÜN ADI</th><th>ADET</th><th>FİYAT</th><th>İŞLEM</th></tr>
                </thead>
                <tbody>
                    {% for p in sepet %}
                    <tr style="height: 90px;">
                        <td><img src="{{ url_for('static', filename='images/' + p.resim|string) }}" width="60" height="60" class="border rounded"></td>
                        <td class="fw-bold text-secondary">{{ p.urun_no }}</td>
                        <td class="fw-bold text-dark">{{ p.urun_adi }}</td>
                        <td><span class="badge bg-primary fs-5">{{ p.adet }} Adet</span></td>
                        <td class="fw-bold text-primary fs-5">{{ p.fiyat }}</td>
                        <td>
                            <a href="{{ url_for('sepet_sil', urun_no=p.urun_no) }}" class="btn btn-danger btn-md fw-bold shadow-sm px-4 rounded-pill">🗑️ KALDIR</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}<div class="text-center py-5"><h3>Sepetiniz Boş</h3><a href="/" class="btn btn-primary mt-3 px-5 fw-bold shadow">Kataloğa Git</a></div>{% endif %}
    </div>
</div>
</body>
</html>
